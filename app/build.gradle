plugins { id 'com.android.application' }
android {
    namespace 'net.lanbridge.android'
    compileSdk 36
    buildToolsVersion '36.0.0'
    defaultConfig {
        applicationId 'net.lanbridge.android'
        minSdk 29
        targetSdk 35
        versionCode 4
        versionName '0.2.1'
    }
    buildFeatures { buildConfig true }
    signingConfigs {
        release {
            storeFile rootProject.file('.signing/lanbridge.jks')
            storePassword System.getenv('LANBRIDGE_STORE_PASSWORD')
            keyAlias 'lanbridge'
            keyPassword System.getenv('LANBRIDGE_STORE_PASSWORD')
        }
    }
    buildTypes {
        release { signingConfig signingConfigs.release; minifyEnabled false }
        debug { applicationIdSuffix '.debug' }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_11; targetCompatibility JavaVersion.VERSION_11 }
}
dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
}
